<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>figure stage</title>
  </head>
  <body>
    <p><label>Mount a file instead: <input id="picker" type="file" accept=".vrm,.glb,model/gltf-binary" /></label></p>
    <p><button id="think" type="button" aria-pressed="false">think</button></p>
    <fieldset id="speaker">
      <legend>speaker</legend>
      <label><input type="radio" name="speaker" value="nobody" checked /> nobody</label>
      <label><input type="radio" name="speaker" value="left" /> left</label>
      <label><input type="radio" name="speaker" value="right" /> right</label>
      <label><input type="radio" name="speaker" value="drag" /> drag me</label>
    </fieldset>
    <fieldset id="voice">
      <legend>voice</legend>
      <label><input type="radio" name="vowel" value="aa" checked /> aa</label>
      <label><input type="radio" name="vowel" value="ih" /> ih</label>
      <label><input type="radio" name="vowel" value="ou" /> ou</label>
      <label><input type="radio" name="vowel" value="ee" /> ee</label>
      <label><input type="radio" name="vowel" value="oh" /> oh</label>
      <button id="speak" type="button">speak</button>
      <label>Speak with an audio file: <input id="voice-picker" type="file" accept="audio/*" /></label>
      <button id="speak-without-voice" type="button">speak without a voice</button>
      <button id="stop" type="button">stop</button>
      <p id="voice-status">quiet</p>
    </fieldset>
    <main id="stage"></main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
