version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 7
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    # why: @vitest/coverage-v8 requires exactly the installed vitest as its
    # peer, so both move in one update.
    groups:
      vitest:
        patterns: ["vitest", "@vitest/*"]
      # why: three-vrm and three-vrm-animation take three as a peer and @types/three follows three's
      # version, so the three move in one update.
      three:
        patterns: ["three", "@pixiv/three-vrm", "@pixiv/three-vrm-animation", "@types/three"]
