name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # Every non-pull-request run gets its own group: GitHub keeps one pending run per group and cancels it when another queues, so a shared group on main loses runs.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # A push is checked against its previous tip; the all-zero SHA marks a
      # branch's first push, which falls back to the parent commit.
      - name: Check for whitespace errors and conflict markers
        env:
          EVENT_NAME: ${{ github.event_name }}
          PULL_REQUEST_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            base="${PULL_REQUEST_BASE}"
          elif [ "${PUSH_BEFORE}" = "0000000000000000000000000000000000000000" ]; then
            base="HEAD^"
          else
            base="${PUSH_BEFORE}"
          fi
          git diff --check "${base}" HEAD

      # pnpm takes its version from package.json's packageManager.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version-file: package.json
          # Without check-latest a range resolves from the runner's tool cache, which can lag the newest major.
          check-latest: true
      # The command tests run the build output, so the build comes before the tests.
      - name: Install, type-check, build and test
        run: |
          pnpm install --frozen-lockfile
          pnpm run check
          pnpm run build
          pnpm run test:coverage
      - name: Upload the unit-test coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: unit-coverage
          path: coverage/lcov.info
          if-no-files-found: error
          retention-days: 1
      - name: Run figure check from the packed tarball
        run: |
          tarball_directory="$(mktemp -d -p .)"
          pnpm pack --pack-destination "${tarball_directory}"
          scripts/check_packed_tarball.sh "${tarball_directory}"/overnightworks-figure-*.tgz
      - name: Run the browser layer under the script policy
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm run test:consumer

  quality:
    name: quality
    needs: [checks]
    if: always()
    permissions:
      contents: read
      actions: read
    uses: overnightworks/quality/.github/workflows/gate.yml@2d2b68bf3916b34f6f2c72a540c1e3d8a947b750 # v0.10.0
    with:
      coverage-artifact: unit-coverage
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
